[package]
name = "jukeboks"
version = "0.1.0"
edition = "2021"
authors = ["JMWatte"]
description = "Een minimalistische, toetsenbord-gestuurde hiërarchische muziekspeler"

# Zorgt voor extra optimalisaties tijdens het compileren (kleinere en snellere exe)
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[dependencies]
# --- GUI Framework (egui via eframe) ---
eframe = "0.36" # Bevat egui.
egui_extras = { version = "0.36", features = ["all_loaders"] } # Noodzakelijk om images te renderen
image = { version = "0.25", features = ["jpeg", "png"] } # Ondersteuning voor de album covers

# --- Audio Weergave & Decodering ---
# rodio regelt de WASAPI output op Windows. symphonia-all zorgt voor pure Rust decodering.
# 0.21+ bevat de byte_len- en total_duration-fixes die voorheen via vendor/rodio gepatcht werden.
rodio = { version = "0.22", features = ["symphonia-all"] }
symphonia = "0.5"

# --- Metadata (Tags uitlezen) ---
lofty = "0.25" # Veel robuuster voor ID3/FLAC/MP4 tags dan symphonia's standaard tag reader

# --- Configuratie (config.toml) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# --- Bestandssysteem & Scannen ---
walkdir = "2.5" # Voor het efficiënt en recursief doorzoeken van de bibliotheek

# --- Concurrency, Caching & State Management ---
crossbeam-channel = "0.5" # Lock-free kanalen om state (zoals huidig nummer) naar de GUI te sturen

bincode = { version = "2.0", features = ["serde"] } # Voor razendsnelle binaire wegschrijving van de database (serde-compat; legacy-config houdt de cache leesbaar)
log = "0.4"
env_logger = "0.11"
natord = "1.0"
rayon = "1.8"
rand = "0.10"

[build-dependencies]
# Embed de app-icoon (jukeboks.ico) in de Windows executable.
embed-resource = "3.0"

[workspace]
